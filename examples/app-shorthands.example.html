<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Structural shorthand editor</title>
    <link rel="stylesheet" href="./example.css">
    <style>
      #editor .atom { display: inline-block; }
      #editor .shorthand[data-shorthand="task"] { background: var(--paper); border: 1px solid var(--ink); }
      #editor .shorthand[data-shorthand="topic"] { background: var(--paper); border-bottom: 2px solid var(--ink); border-radius: 0; padding-left: 0; padding-right: 0; }
    </style>
    <script type="importmap">
      { "imports": { "structural": "../src/js/structural/index.js" } }
    </script>
  </head>
  <body>
    <div class="example-page">
      <header class="example-header">
        <h1>Configurable shorthands</h1>
        <p class="hint">Try <code>#</code>, <code>@</code>, <code>+</code>, or <code>!</code>. Type a date such as <code>@2026-08-23 </code> to convert it automatically.</p>
      </header>
      <div class="editor-shell">
        <div id="editor" class="example-editor" tabindex="0"><p>Plan the launch with @alice.</p><p>Remember to +review the release notes.</p></div>
        <div id="selection" aria-hidden="true"></div>
        <div id="caret" aria-hidden="true"></div>
        <div id="suggestions" role="listbox" aria-label="Shorthand suggestions"></div>
      </div>
      <div id="events" aria-live="polite"></div>
    </div>

    <script type="module">
      import {
        Editor, RichText, Shorthands,
        richTextClasses, richTextKeymap, richTextSchema,
      } from "structural";

      const root = document.querySelector("#editor");
      const caret = document.querySelector("#caret");
      const selection = document.querySelector("#selection");
      const menu = document.querySelector("#suggestions");
      const events = document.querySelector("#events");
      const catalog = {
        tag: [{ id: "planning", label: "planning" }, { id: "release", label: "release" }, { id: "writing", label: "writing" }],
        mention: [{ id: "alice", label: "alice" }, { id: "bob", label: "bob" }, { id: "casey", label: "casey" }],
        task: [{ id: "review", label: "review" }, { id: "test", label: "test" }, { id: "ship", label: "ship" }],
        topic: [{ id: "product", label: "product" }, { id: "design", label: "design" }, { id: "support", label: "support" }],
      };

      const editor = new Editor(root, {
        schema: richTextSchema(),
        keymap: richTextKeymap(),
        classes: richTextClasses(),
        cursor: { preserveSemanticBoundaries: true, collapseBoundary: false },
        caret: { node: caret, mode: "virtual", focused: true },
        selection: { node: selection, mode: "virtual" },
        plugins: [RichText, new Shorthands({
          definitions: [
            { id: "tag", trigger: "#", source: (query) => filter("tag", query) },
            { id: "mention", trigger: "@", className: "atom shorthand mention", source: (query) => filter("mention", query) },
            { id: "task", trigger: "+", source: (query) => filter("task", query) },
            { id: "topic", trigger: "!", source: (query) => filter("topic", query) },
            { id: "date", trigger: "@", pattern: /^\d{4}-\d{2}-\d{2}$/, auto: "delimiter" },
          ],
        })],
      });

      function filter(kind, query) {
        const needle = query.toLowerCase();
        return catalog[kind].filter((item) => item.label.includes(needle));
      }

      function renderSuggestions(event) {
        const items = event.detail.items ?? [];
        menu.innerHTML = "";
        for (const item of items) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = `${event.detail.trigger}${item.label}`;
          button.addEventListener("mousedown", (click) => {
            click.preventDefault();
            editor.input._editorActive = true;
            root.focus({ preventScroll: true });
            editor.shorthands.pick(item);
            menu.classList.remove("open");
          });
          menu.append(button);
        }
        menu.classList.toggle("open", items.length > 0);
      }

      root.addEventListener("ShorthandOpen", renderSuggestions);
      root.addEventListener("ShorthandChange", renderSuggestions);
      root.addEventListener("ShorthandDismiss", () => menu.classList.remove("open"));
      root.addEventListener("ShorthandCommit", (event) => {
        menu.classList.remove("open");
        events.textContent = `Committed ${event.detail.definition.id}`;
      });
      root.addEventListener("DocumentChange", (event) => {
        events.textContent = `Document change: ${event.detail.kind}`;
      });
      editor.input.cursor.moveTo(0);
    </script>
  </body>
</html>
