<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaboration Editor - Structural.js</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./example.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "structural": "../src/js/structural/index.js"
      }
    }
    </script>
  </head>
  <body>
    <div id="mount"></div>
    <script type="module">
      import { createCollaborationEditor } from "./app-collaboration.editor.js";

      const params = new URLSearchParams(window.location.search);
      const app = createCollaborationEditor(document.getElementById("mount"), {
        room: params.get("room") || "structural-collaboration-demo",
        canSeed: params.get("seed") === "1",
        infoText: "Open two tabs or use the parent demo page. This instance syncs through a room-scoped BroadcastChannel with no persistence.",
      });

      window.addEventListener("beforeunload", () => app.destroy());
    </script>
  </body>
</html>
