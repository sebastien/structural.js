<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Collaboration Demo - Structural.js</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./example.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "structural": "../src/js/structural/index.js"
      }
    }
    </script>
    <style>
      .example-page.wide { max-width: 72rem; }
      .main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.25rem;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .panel-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .embedded-host { min-height: 680px; }
      iframe {
        display: block;
        width: 100%;
        height: 760px;
        border: 0;
        background: var(--page);
      }
      @media (max-width: 900px) {
        .main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="example-page wide">
      <header class="example-header">
        <h1>Structural.js Collaboration Demo</h1>
        <p>The left editor is embedded directly in this page. The right editor runs in an iframe. Both share the same room and synchronize through a shared <code>Y.XmlFragment</code> over <code>BroadcastChannel</code>.</p>
      </header>

      <div class="main">
        <div class="panel">
          <div class="panel-header">
            <strong>Editor A</strong>
            <span class="example-tag">embedded</span>
          </div>
          <div id="embedded-editor" class="embedded-host"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <strong>Editor B</strong>
            <span class="example-tag">iframe</span>
          </div>
          <iframe id="iframe2" src="app-collaboration.editor.html?room=demo"></iframe>
        </div>
      </div>
    </div>

    <script type="module">
      import { createCollaborationEditor } from "./app-collaboration.editor.js";

      const app = createCollaborationEditor(document.getElementById("embedded-editor"), {
        room: "demo",
        canSeed: true,
        infoText: "This editor is embedded directly in the host page, not inside an iframe.",
      });

      window.addEventListener("beforeunload", () => app.destroy());
    </script>
  </body>
</html>
