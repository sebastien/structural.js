<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentions — Structural.js</title>
    <link rel="stylesheet" href="./example.css">
    <script type="importmap">
    {
      "imports": {
        "structural": "../src/js/structural/index.js"
      }
    }
    </script>
  </head>
  <body>
    <div class="example-page">
      <header class="example-header">
        <h1>Mentions</h1>
        <p>Atomic variables and mention-style inline annotations.</p>
      </header>
      <div class="editor-shell">
        <div id="editor" class="example-editor" tabindex="0">
          <p>Task for <span class="C mention"><span class="skipped">@</span>alice</span></p>
          <p>Buy some milk and <span class="atom">{ItemName}</span></p>
        </div>
        <div id="selection"></div>
        <div id="caret"></div>
      </div>
    </div>
    <script type="module">
      import { Editor } from "structural";
      const editor = new Editor(document.getElementById("editor"), {
        caret: { mode: "virtual", node: document.getElementById("caret"), focused: true },
        selection: { mode: "virtual", node: document.getElementById("selection") },
      });
      const nodeLabel = node => {
        if (!node) {
          return "null";
        }
        if (node.nodeType === Node.TEXT_NODE) {
          const preview = (node.data ?? "").replace(/\s/g, " ").slice(0, 12);
          return `#text(\"${preview}\")`;
        }
        const tag = node.nodeName.toLowerCase();
        const klass = node.className ? `.${String(node.className).trim().replace(/\s+/g, ".")}` : "";
        return `${tag}${klass}`;
      };
      editor.root.addEventListener("CursorMove", event => {
        const { current } = event.detail;
        console.log("CursorMove", {
          offset: current.offset,
          requestedOffset: current.requestedOffset,
          delta: current.delta,
          kind: current.kind,
          anchor: nodeLabel(current.anchor),
          boundary: {
            left: nodeLabel(current.boundary?.leftNode),
            right: nodeLabel(current.boundary?.rightNode),
          },
          char: current.char,
          remap: current.remap,
          caretSource: current.caretSource,
        });
        event.detail.previous.anchor?.classList?.remove("focus");
        event.detail.current.anchor?.classList?.add("focus");
      });
      editor.input.cursor.moveTo(0);
    </script>
  </body>
</html>
