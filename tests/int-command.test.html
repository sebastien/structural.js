<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script type="importmap">
    {
      "imports": {
        "structural/editor": "/src/js/structural/editor.js",
        "structural/richtext": "/src/js/structural/richtext.js",
        "structural/cursor": "/src/js/structural/cursor.js",
        "structural/text": "/src/js/structural/text.js",
        "structural/selection": "/src/js/structural/selection.js",
        "structural/range": "/src/js/structural/range.js"
      }
    }
    </script>
  </head>
  <body>
    <div id="editor">hello</div>
    <div id="basic-editor">abc</div>
    <script type="module">
      import { Editor, EditorCommand, EditorTransaction } from "structural/editor";
      import { richTextKeymap, richTextSchema } from "structural/richtext";

      const stringCommand = EditorCommand.from("toggleInline:strong", {
        actor: "agent",
        selection: { offset: 12, selectionKind: "caret" },
      });
      const objectCommand = EditorCommand.from({
        type: "toggleBlock",
        args: { tag: "h2" },
        meta: { source: "keymap" },
      }, { actor: "local", mode: "insert" });
      const transactionCommand = EditorCommand.from({ type: "splitBlock" }, { actor: "local" });
      const transaction = new EditorTransaction(transactionCommand, {
        steps: [{ type: "splitNode", path: [0], offset: 3 }],
        inverse: [{ type: "mergeNode", path: [0] }],
        selectionBefore: { offset: 3 },
        selectionAfter: { offset: 4 },
        result: true,
      });
      const editor = new Editor(document.getElementById("editor"), {
        schema: richTextSchema(),
        keymap: richTextKeymap(),
      });
      const basicEditor = new Editor(document.getElementById("basic-editor"));
      // Falsy action still must swallow Mod+B (browser bookmark chord).
      editor.configureActions({
        toggleInline: () => false,
      });

      function defaultPreventedFor(init) {
        const event = new KeyboardEvent("keydown", {
          bubbles: true,
          cancelable: true,
          ...init,
        });
        document.dispatchEvent(event);
        return event.defaultPrevented;
      }

      window.__result = {
        stringCommand: stringCommand.toJSON(),
        objectCommand: objectCommand.toJSON(),
        transaction: {
          handled: transaction.handled,
          json: transaction.toJSON(),
        },
        keys: {
          ctrlR: defaultPreventedFor({ key: "r", ctrlKey: true }),
          f5: defaultPreventedFor({ key: "F5" }),
          ctrlB: defaultPreventedFor({ key: "b", ctrlKey: true }),
        },
        defaultKeymap: (() => {
          basicEditor.input.cursor.moveTo(1);
          const shiftRight = defaultPreventedFor({ key: "ArrowRight", shiftKey: true });
          const shifted = basicEditor.input.cursor.selection.normalizedRange();
          const selectAll = defaultPreventedFor({ key: "a", ctrlKey: true });
          const all = basicEditor.input.cursor.selection.normalizedRange();
          // Ctrl+A selects structural text scope (last text index), not the trailing
          // element-boundary slot at positions().length - 1.
          const whole = basicEditor.structuralRangeFor(basicEditor.root);
          const collapse = defaultPreventedFor({ key: "a", ctrlKey: true, shiftKey: true });
          return {
            shiftRight,
            shifted: { start: shifted.start, end: shifted.end },
            selectAll,
            selectedWholeEditor: !!whole && all.start === whole.start && all.end === whole.end,
            collapse,
            selectionKind: basicEditor.input.cursor.selectionKind,
          };
        })(),
      };
    </script>
  </body>
</html>
