<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blockquote Toggle Test</title>
  <script type="importmap">
  { "imports": {
    "structural": "/src/js/structural/index.js"
  }}
  </script>
</head>
<body>
  <div id="toolbar">
    <button data-kind="block" data-tag="blockquote" type="button">Quote</button>
  </div>
  <div id="editor"><h1>Collaborative document</h1><p>Body</p></div>
  <script type="module">
    import { Editor } from "structural";
    import { Modification } from "structural";
    import { richTextSchema } from "structural";

    const editor = new Editor(document.getElementById("editor"), {
      schema: richTextSchema(),
    });
    const mod = new Modification(editor);
    const toolbar = document.getElementById("toolbar");

    toolbar.addEventListener("mousedown", event => event.preventDefault());
    toolbar.addEventListener("click", event => {
      const button = event.target.closest("button[data-tag]");
      if (!button) return;
      mod.toggleBlock(button.dataset.tag);
    });

    window.__test = {
      pointForText(text, offset) {
        const heading = document.querySelector("#editor h1");
        const walker = document.createTreeWalker(heading, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          const index = node.data.indexOf(text);
          if (index < 0) continue;
          const range = document.createRange();
          const start = index + offset;
          range.setStart(node, start);
          range.setEnd(node, Math.min(node.data.length, start + 1));
          const rect = range.getBoundingClientRect();
          return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        }
        return null;
      },
      html() {
        return document.getElementById("editor").innerHTML;
      },
    };
  </script>
</body>
</html>
