<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script type="importmap">
    {
      "imports": {
        "structural": "/src/js/structural/index.js"
      }
    }
    </script>
  </head>
  <body>
    <div id="editor"><p>hello</p></div>
    <script type="module">
      import { Editor } from "structural";
      import { richTextKeymap, richTextSchema, RichText } from "structural";

      const root = document.getElementById("editor");
      const editor = new Editor(root, {
        schema: richTextSchema(),
        keymap: richTextKeymap(),
        plugins: [RichText],
        // Disable coalesce so each op is its own undo step in tests.
        history: { coalesceMs: 0 },
      });
      editor.input.cursor.moveTo(5);

      const baseline = root.textContent;
      editor.input.cursor.insertText("!");
      const afterInsert = root.textContent;
      const canUndoAfterInsert = editor.history.canUndo;

      editor.undo();
      const afterUndo = root.textContent;
      const canRedoAfterUndo = editor.history.canRedo;

      editor.redo();
      const afterRedo = root.textContent;

      // Second insert then undo should restore "hello!"
      editor.input.cursor.moveTo(root.textContent.length);
      editor.input.cursor.insertText("x");
      editor.undo();
      const afterSecondUndo = root.textContent;

      // Mod+Z is bound and preventDefaulted
      const undoEvent = new KeyboardEvent("keydown", {
        key: "z",
        ctrlKey: true,
        bubbles: true,
        cancelable: true,
      });
      document.dispatchEvent(undoEvent);
      const modZPrevented = undoEvent.defaultPrevented;
      const afterModZ = root.textContent;

      window.__result = {
        baseline,
        afterInsert,
        canUndoAfterInsert,
        afterUndo,
        canRedoAfterUndo,
        afterRedo,
        afterSecondUndo,
        modZPrevented,
        afterModZ,
      };
    </script>
  </body>
</html>
