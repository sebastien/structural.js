<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script type="importmap">
    {
      "imports": {
        "structural": "/src/js/structural/index.js"
      }
    }
    </script>
  </head>
  <body>
    <div id="editor" tabindex="0"><p>hello world</p></div>
    <textarea id="foreign">chat</textarea>
    <script type="module">
      import { Editor } from "structural";
      import { richTextKeymap, richTextSchema, RichText } from "structural";

      const root = document.getElementById("editor");
      const foreign = document.getElementById("foreign");
      const editor = new Editor(root, {
        schema: richTextSchema(),
        keymap: richTextKeymap(),
        plugins: [RichText],
        history: { coalesceMs: 0 },
      });

      // Select "hello"
      editor.input.cursor.select(0, 5);
      const copied = editor.richText.copySelection();
      const afterCopy = root.textContent;

      const cutOk = editor.richText.cutSelection();
      const afterCut = root.textContent;

      editor.undo();
      const afterUndoCut = root.textContent;

      // Paste plain text at end (collapse any restored range first).
      editor.input.cursor.selection?.clear?.();
      editor.input.cursor.moveTo(root.textContent.length);
      const pasteOk = editor.richText.pasteText("!");
      const afterPaste = root.textContent;

      // Foreign textarea: clipboard ops must not touch the editor
      foreign.focus();
      foreign.select();
      const beforeForeign = root.textContent;
      const ownsForeign = editor.richText.ownsClipboard({ target: foreign });
      const foreignCopy = editor.richText.copySelection({
        target: foreign,
        preventDefault() {},
        stopPropagation() {},
        clipboardData: {
          data: {},
          setData(type, value) {
            this.data[type] = value;
          },
          getData(type) {
            return this.data[type] ?? "";
          },
        },
      });
      const afterForeign = root.textContent;

      // Key chords for copy/cut pass through (native bindings): the document
      // copy/cut event carries the synchronous payload. Paste is document-event only.
      function prevented(init) {
        const event = new KeyboardEvent("keydown", {
          bubbles: true,
          cancelable: true,
          ...init,
        });
        document.dispatchEvent(event);
        return event.defaultPrevented;
      }
      function clipboardPayload() {
        return {
          bubbles: true,
          cancelable: true,
          target: root,
          defaultPrevented: false,
          preventDefault() {
            this.defaultPrevented = true;
          },
          stopPropagation() {},
          clipboardData: {
            data: {},
            setData(type, value) {
              this.data[type] = value;
            },
            getData(type) {
              return this.data[type] ?? "";
            },
          },
        };
      }
      root.focus();
      editor.input._editorActive = true;
      editor.input.cursor.select(0, 1);

      // Simulate a paste event with clipboardData (Ctrl+V path uses document paste).
      editor.input.cursor.selection?.clear?.();
      editor.input.cursor.moveTo(root.textContent.length);
      const beforeEventPaste = root.textContent;
      const pastePayload = {
        bubbles: true,
        cancelable: true,
        target: root,
        defaultPrevented: false,
        preventDefault() {
          this.defaultPrevented = true;
        },
        stopPropagation() {},
        clipboardData: {
          getData(type) {
            return type === "text/plain" || type === "text" ? "PASTE" : "";
          },
        },
      };
      const eventPasteOk = editor.richText.pasteText(null, null, pastePayload);
      const afterEventPaste = root.textContent;

      // Document copy/cut events carry the synchronous payload (the path
      // real Ctrl+C/X takes now that keydown chords pass through).
      editor.input.cursor.select(0, 5);
      const copyPayload = clipboardPayload();
      editor.richText.onCopy(copyPayload);
      editor.input.cursor.select(0, 5);
      const cutPayload = clipboardPayload();
      editor.richText.onCut(cutPayload);
      const afterEventCut = root.textContent;

      window.__result = {
        copied,
        afterCopy,
        cutOk,
        afterCut,
        afterUndoCut,
        pasteOk,
        afterPaste,
        foreignCopy,
        ownsForeign,
        beforeForeign,
        afterForeign,
        beforeEventPaste,
        afterEventPaste,
        eventPasteOk,
        pasteEventPrevented: pastePayload.defaultPrevented,
        modC: prevented({ key: "c", ctrlKey: true }),
        modX: prevented({ key: "x", ctrlKey: true }),
        eventCopyPrevented: copyPayload.defaultPrevented,
        eventCopyText: copyPayload.clipboardData.data["text/plain"],
        eventCutPrevented: cutPayload.defaultPrevented,
        eventCutText: cutPayload.clipboardData.data["text/plain"],
        afterEventCut,
      };
    </script>
  </body>
</html>
